<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motion</title>
    <style>
        body {
            margin: 0;
            padding: 16px;
            background-color: #0b0b12;
            color: #f3e6d0;
            font-family: Georgia, "Times New Roman", serif;
        }

        h1 {
            margin: 0 0 6px 0;
            color: #ff7a1a;
            text-shadow: 0 0 10px #ff4d00;
        }

     
        button {
            padding: 8px 18px;
            margin-right: 6px;
            font-size: 1rem;
            border: none;
            border-radius: 6px;
            background-color: #ff7a1a;
            color: #0b0b12;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #ffa04d;
        }


        #container {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
        }

        #house {
            width: 100%;
            height: 600px;
            position: relative;
            background-image: url('spooky.jpg');
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
        }

      
        #skull {
            width: 100px;
            height: 100px;
            position: absolute;
            top: -500px;
            left: -500px;
        }
        #zombie {
         width: 100px;
            height: 100px;
            position: absolute;
            top: -500px;
            left: -500px;
}
    </style>
    <script src="motion.js" defer></script>
</head>

<body>
    <p><button onclick="move()">Move It!</button>&nbsp;<button onclick="stopMoving()">Stop!</button></p>

    <div id="container">
        <div id="house"></div>
        <img id="skull" src="skull/skull0000.png" alt="floating skull" />
         <img id="zombie" src="zombie/zombie0001.png" alt="walking zombie" />
    </div>
</body>

</html>
